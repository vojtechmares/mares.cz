when:
  - event: push

workspace:
  base: /woodpecker
  path: mares.cz

variables:
  - &node_image "node:22"

steps:
  - name: setup
    image: *node_image
    commands:
      - export PNPM_STORE_DIR=$${CI_WORKSPACE}/.pnpm-store
      - export PNPM_HOME=$${CI_WORKSPACE}/pnpm
      - export PATH="$PNPM_HOME:$PATH"
      - corepack enable
      - corepack prepare pnpm@latest-10 --activate
      - pnpm config set store-dir $PNPM_STORE_DIR
      - SHELL="$(which bash)" pnpm setup
      - source ~/.bashrc
      - pnpm add -g vercel

  - name: install
    image: *node_image
    commands:
      - export PNPM_STORE_DIR=$${CI_WORKSPACE}/.pnpm-store
      - export PNPM_HOME=$${CI_WORKSPACE}/pnpm
      - export PATH="$PNPM_HOME:$PATH"
      - pnpm install --frozen-lockfile

  - name: format_check
    image: *node_image
    commands:
      - export PNPM_STORE_DIR=$${CI_WORKSPACE}/.pnpm-store
      - export PNPM_HOME=$${CI_WORKSPACE}/pnpm
      - export PATH="$PNPM_HOME:$PATH"
      - pnpm run format:check

  - name: test
    image: *node_image
    commands:
      - export PNPM_STORE_DIR=$${CI_WORKSPACE}/.pnpm-store
      - export PNPM_HOME=$${CI_WORKSPACE}/pnpm
      - export PATH="$PNPM_HOME:$PATH"
      - pnpm run test
