default:
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/node:22
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - node_modules

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA

stages:
  - install
  - test
  - build
  - deploy

.before_script: &pnpm_before_script
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-9 --activate
    - pnpm config set store-dir .pnpm-store
    - SHELL="$(which bash)" pnpm setup
    - source ~/.bashrc

install:
  stage: install
  script:
    - pnpm install --frozen-lockfile
  <<: *pnpm_before_script

test:
  stage: test
  variables:
    CMS_API_URL: https://cms.mareshq.com/api
  script:
    - pnpm run test
  <<: *pnpm_before_script

format:
  stage: test
  script:
    - pnpm run format:check
  <<: *pnpm_before_script

lint:
  stage: test
  script:
    - pnpm run lint
  <<: *pnpm_before_script

test:helm:
  stage: test
  image: ghcr.io/vojtechmares/toolkit:latest
  tags:
    - amd64 # temp fix before I create multi-platform image
  script:
    - helm lint ./deploy/k8s
    - helm template website ./deploy/k8s
  cache: []

build:docker:
  stage: build
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:git
  tags:
    - amd64
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker info
  script:
    - >
      docker build --push \
        --provenance=false \
        --build-arg CMS_API_TOKEN=$CMS_API_TOKEN \
        -t $IMAGE:$TAG .
  # no cache is needed here
  # this makes job faster, since it does not have to pull the cache
  cache: []

deploy:staging:
  stage: deploy
  image: docker:git

  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

  environment:
    name: staging
    url: https://beta.mares.cz

  variables:
    GIT_DEPTH: 1 # shallow clone

  before_script:
    - "command -v ssh-agent >/dev/null || ( apk add --no-cache openssh-client )"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H valhalla.vxm.cz >> ~/.ssh/known_hosts
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

  script:
    - apk update && apk add docker-cli-compose
    - docker context create remote-valhalla --docker "host=ssh://root@valhalla.vxm.cz"
    - docker --context remote-valhalla compose --file ./deploy/docker-compose.beta.yml up --detach --force-recreate

deploy:production:
  stage: deploy
  image: docker:git

  rules:
    - if: $CI_COMMIT_BRANCH == 'production'

  environment:
    name: production
    url: https://www.mares.cz

  variables:
    GIT_DEPTH: 1 # shallow clone

  before_script:
    - "command -v ssh-agent >/dev/null || ( apk add --no-cache openssh-client )"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H valhalla.vxm.cz >> ~/.ssh/known_hosts
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

  script:
    - apk update && apk add docker-cli-compose
    - docker context create remote-valhalla --docker "host=ssh://root@valhalla.vxm.cz"
    - docker --context remote-valhalla compose --file ./deploy/docker-compose.prod.yml up --detach --force-recreate
