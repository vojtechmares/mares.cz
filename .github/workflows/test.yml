name: build and test app

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: build and test app
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: lint check
        shell: bash
        run: pnpm lint

      - name: format check
        shell: bash
        run: pnpm format
