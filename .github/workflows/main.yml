name: build and deploy main

on:
    push:
        branches:
            - main

jobs:
    build:
        name: build container image
        runs-on: ubuntu-24.04

        permissions:
            contents: read
            packages: write
            attestations: write
            id-token: write

        steps:
            - name: checkout
              uses: actions/checkout@v5

            - name: docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: |
                      ${{ github.repository }}/app
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: login to github container registry
              uses: docker/login-action@v3
              with:
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}
                  registry: ghcr.io

            - name: set up qemu
              uses: docker/setup-qemu-action@v3

            - name: set up docker buildx
              uses: docker/setup-buildx-action@v3

            - name: build and push
              uses: docker/build-push-action@v6
              with:
                  push: true
                  platforms: linux/amd64
                  tags: ${{ steps.meta.outputs.tags }}
                  provenance: mode=max
                  sbom: true
                  cache-from: type=registry,ref=${{ github.repository }}/app:buildcache
                  cache-to: type=registry,ref=${{ github.repository }}/app:buildcache,mode=max
                  secrets: |
                      STRAPI_API_URL=${{ secrets.STRAPI_API_URL }}
                      STRAPI_API_TOKEN=${{ secrets.STRAPI_API_TOKEN }}
                      NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}
                      NOTION_TRAINING_SESSIONS_DATABASE_ID=${{ secrets.NOTION_TRAINING_SESSIONS_DATABASE_ID }}
