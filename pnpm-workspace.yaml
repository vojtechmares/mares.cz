# allowBuilds opts specific packages into running install/postinstall scripts
# (pnpm blocks them by default). @swc/core and cbor-extract come in via the
# `workflow` package: @swc/core powers @workflow/astro's build-time transform
# (this is an Astro project, so it is actually used) and its postinstall just
# verifies the native binding / arranges a wasm fallback; cbor-extract's install
# resolves a prebuilt native accelerator for cbor serialization. @nestjs/core's
# only script is `opencollective || exit 0` (a funding banner) and the Nest
# integration is unused here, so it stays blocked.
allowBuilds:
  '@nestjs/core': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  cbor-extract: true
  esbuild: true
  sharp: true

# trustPolicyExclude allowlists specific package versions that pnpm's
# supply-chain "trust downgrade" heuristic flags. semver@6.3.1 is the
# legitimate 2023 ReDoS-fix release, pulled in transitively via
# @vitejs/plugin-react -> @babel/core. It lacks provenance attestation that an
# earlier release carried, which trips the no-downgrade policy. Excluding only
# this exact version keeps the guardrail active for everything else.
#
# chokidar@4.0.3 is the legitimate 2024-12-18 release by paulmillr (canonical
# github.com/paulmillr/chokidar maintainer), pulled in transitively via
# workflow -> @workflow/cli. Like semver above, it lacks provenance attestation
# an earlier release carried, which trips the no-downgrade policy.
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'chokidar@4.0.3'

# minimumReleaseAgeExclude opts specific packages out of the 15-day publish
# cooldown (pnpm's minimumReleaseAge default). The AWS SDK ecosystem publishes
# multiple times a week, so @aws-sdk/* and @smithy/* are almost always inside
# the cooldown window; tar is a transitive build dep (@vercel/nft ->
# node-pre-gyp) whose latest release is also recent. The cooldown stays active
# for everything else.
minimumReleaseAgeExclude:
  - '@aws-sdk/*'
  - '@smithy/*'
  - '@aws-crypto/*'
  - 'tar'
