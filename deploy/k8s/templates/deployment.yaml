apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: "backend"
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: "backend"
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: "backend"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
        #   livenessProbe:
        #     httpGet:
        #       path: /healthz
        #       port: 8080
        #     failureThreshold: 1
        #     periodSeconds: 5
        #   # app does not start straight away, so a startup probe helps to reduce 503 errors (or 502, because of ingress controller)
        #   startupProbe:
        #     httpGet:
        #       path: /startupz
        #       port: 8080
        #     failureThreshold: 12 # 1 minute (5 seconds * 12 = 60 seconds)
        #     periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - secretRef:
              name: {{ .Release.Name }}-strapi-credentials
            - secretRef:
              name: {{ .Release.Name }}-notion-credentials
            - configMapRef:
              name: {{ .Release.Name }}-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            # readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
