# https://taskfile.dev

version: "3"

dotenv:
  - .prod.env

vars:
  IMAGE_NAME: '{{default "mares.cz" .IMAGE_NAME}}'
  IMAGE_TAG: '{{default "latest" .IMAGE_TAG}}'

tasks:
  docker:build:
    desc: Build Docker image with production secrets
    cmds:
      - |
        echo "Building Docker image: {{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
        docker build \
          --secret id=STRAPI_API_URL,env=STRAPI_API_URL \
          --secret id=STRAPI_API_TOKEN,env=STRAPI_API_TOKEN \
          --secret id=NOTION_API_KEY,env=NOTION_API_KEY \
          --secret id=NOTION_TRAINING_SESSIONS_DATABASE_ID,env=NOTION_TRAINING_SESSIONS_DATABASE_ID \
          -t "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}" \
          .
        echo "Successfully built {{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    preconditions:
      - test -f .prod.env
      - sh: test -n "$STRAPI_API_URL"
        msg: "STRAPI_API_URL is not set in .prod.env"
      - sh: test -n "$STRAPI_API_TOKEN"
        msg: "STRAPI_API_TOKEN is not set in .prod.env"
      - sh: test -n "$NOTION_API_KEY"
        msg: "NOTION_API_KEY is not set in .prod.env"
      - sh: test -n "$NOTION_TRAINING_SESSIONS_DATABASE_ID"
        msg: "NOTION_TRAINING_SESSIONS_DATABASE_ID is not set in .prod.env"

  docker:run:
    desc: Run Docker container locally with production environment variables
    cmds:
      - |
        echo "Running Docker container with environment variables from .prod.env"
        echo "Image: {{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
        echo ""
        docker run --rm -it \
          -p 8080:8080 \
          -e STRAPI_API_URL="$STRAPI_API_URL" \
          -e STRAPI_API_TOKEN="$STRAPI_API_TOKEN" \
          -e NOTION_API_KEY="$NOTION_API_KEY" \
          -e NOTION_TRAINING_SESSIONS_DATABASE_ID="$NOTION_TRAINING_SESSIONS_DATABASE_ID" \
          -e DISABLE_ANALYTICS="$DISABLE_ANALYTICS" \
          "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    preconditions:
      - test -f .prod.env
