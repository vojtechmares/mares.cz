image:
  pullSecrets:
    - name: mareshq-gitlab-registry

replicas: 2

ingress:
  host: staging.website.vmdevel.cz
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns-production
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Caching on the Ingress Controller
    nginx.ingress.kubernetes.io/proxy-buffering: "on" # Important!
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_cache static-cache;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale error timeout updating http_404 http_500 http_502 http_503 http_504;
      proxy_cache_bypass $http_x_purge;
      add_header X-Cache-Status $upstream_cache_status;

config:
  apiKey: "3b1effbcbab4c76c2601ab908294700e5af22ca08082459d64a06cc080ac7641"

cron:
  refreshBlog:
    enabled: true
