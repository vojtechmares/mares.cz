replicas: 1

image:
  pullPolicy: IfNotPresent
  repository: registry.mareshq.com/hq/website
  tag: latest
  pullSecrets: []

service:
  type: ClusterIP
  port: 80
  portName: http
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: www.example.com
  path: /
  pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 300m
    memory: 512Mi

config:
  suppressGoogleAnalytics: true
  apiKey: "xxx"

cron:
  refreshBlog:
    enabled: false
    schedule: "0 5 * * *"
    image: "curlimages/curl:7.76.1"
